<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="opt_title">Guard3 settings</title>
<style>
  body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  p { line-height: 1.5; opacity: .85; font-size: 14px; }
  label { display: block; font-size: 13px; opacity: .8; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; font: 14px ui-monospace, monospace; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1b1b1b; color: #eee; }
  button { font: inherit; margin-top: 10px; margin-right: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; }
  .ok { color: #9be3b0; font-size: 13px; margin-left: 6px; }
  pre { background: #1b1b1b; padding: 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
  ul { padding-left: 18px; line-height: 1.8; font-size: 14px; }
  a.rm { color: #ff8a8a; margin-left: 8px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
  <h1 data-i18n="opt_title">Guard3 settings</h1>

  <h2 data-i18n="opt_warn_heading">Page protection</h2>
  <label><input type="radio" name="warn" value="page" id="warn-page"> <span data-i18n="opt_warn_page">Show on the page</span></label>
  <label><input type="radio" name="warn" value="popup" id="warn-popup"> <span data-i18n="opt_warn_popup">Toolbar only</span></label>
  <label style="color:#ff8a8a"><input type="radio" name="warn" value="off" id="warn-off"> <span data-i18n="opt_warn_off">Off</span></label>
  <p style="color:#ff8a8a;margin:2px 0 0 24px;font-size:12px" data-i18n="opt_warn_off_note">Known phishing pages will no longer be blocked.</p>
  <p id="warn-note" data-i18n="opt_warn_note"></p>

  <h2 data-i18n="opt_gate_heading">Wallet gate</h2>
  <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="strict" style="width:auto;margin-top:3px"> <span><span data-i18n="opt_strict">Strict mode: check every transaction</span><br><span style="opacity:.7;font-size:12px" data-i18n="opt_strict_note">Show a confirmation for every transaction, even on trusted sites. More interruptions, wider coverage.</span></span></label>
  <h3 style="font-size:14px;margin:18px 0 0" data-i18n="opt_online_heading">Online checks at the gate</h3>
  <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="simulate" style="width:auto;margin-top:3px"> <span><span data-i18n="opt_sim_heading">Transaction simulation</span><br><span style="opacity:.7;font-size:12px" data-i18n="opt_simulate">Simulate held transactions through a public RPC (sends the pending transaction to publicnode / 1rpc / dRPC)</span></span></label>
  <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="addrscreen" style="width:auto;margin-top:3px"> <span><span data-i18n="opt_addr_heading">Address screening</span><br><span style="opacity:.7;font-size:12px" data-i18n="opt_addr_note">Check the counterparty address against known-scam lists. The address already goes on-chain with the transaction. Turn off for no network at the gate.</span></span></label>

  <h2 data-i18n="opt_trusted_heading">Domains you marked as trusted</h2>
  <ul id="trusted"></ul>

  <h2 data-i18n="opt_lists_heading">Lists</h2>
  <button id="refreshlists" data-i18n="opt_refresh_lists">Refresh lists now</button>
  <span id="listsstatus" class="ok"></span>

  <script src="options.js"></script>
</body>
</html>
