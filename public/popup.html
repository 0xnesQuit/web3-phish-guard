<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#0b0e16; --bg2:#10141f; --card:#141926; --line:#222a3a;
    --ink:#e8ecf6; --muted:#9aa6c0; --faint:#6b7691;
    --accent:#5b8cff; --accent2:#7aa2ff; --danger:#ff5b6e; --ok:#43c08a; --warn:#f5b84b;
    --radius:14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.45; background: var(--bg); color: var(--ink); overflow-wrap: anywhere; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: .2px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; display: block; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
  .badge.safe { background: rgba(67,192,138,.14); color: var(--ok); border-color: rgba(67,192,138,.35); }
  .badge.warn { background: rgba(245,184,75,.14); color: var(--warn); border-color: rgba(245,184,75,.35); }
  .badge.block { background: rgba(255,91,110,.14); color: var(--danger); border-color: rgba(255,91,110,.4); }
  .badge.none { background: rgba(154,166,192,.12); color: var(--muted); border-color: var(--line); }
  main { padding: 12px 14px 14px; }
  .host { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; word-break: break-all; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  ul:empty { display: none; }
  li { margin: 3px 0; color: var(--ink); }
  li::marker { color: var(--faint); }
  .meta { margin-top: 12px; color: var(--faint); font-size: 11px; line-height: 1.55; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; margin-top: 0; }
  button { font: inherit; font-weight: 600; width: 100%; margin-top: 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s, transform .05s; }
  button:hover:not(:disabled) { background: #1a2133; border-color: #2e3850; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
  #allow { color: var(--warn); border-color: rgba(245,184,75,.35); background: rgba(245,184,75,.08); }
  #allow:hover:not(:disabled) { background: rgba(245,184,75,.16); border-color: rgba(245,184,75,.5); }
  #options { background: transparent; color: var(--muted); }
  #options:hover:not(:disabled) { color: var(--ink); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  #deep { display: none; margin-top: 12px; padding: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
  #deep .v { font-weight: 700; margin-bottom: 6px; }
  #deep .v.dangerous { color: var(--danger); } #deep .v.suspicious { color: var(--warn); } #deep .v.likely_safe, #deep .v.safe { color: var(--ok); }
  #deep ul { margin: 6px 0; }
  #deep .adv { margin-top: 6px; color: var(--muted); }
  #deep .facts { margin-top: 8px; font-size: 11px; color: var(--faint); line-height: 1.5; }
  #deep .sandbox { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #deep .sandbox .sbh { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  #deep .sandbox .sbstate { font-size: 12px; margin: 2px 0 6px; line-height: 1.4; }
  #deep .sandbox .sbicon { display: inline-block; min-width: 1.2em; }
  #deep .sandbox .sb-used { color: var(--ok); } #deep .sandbox .sb-off { color: var(--muted); } #deep .sandbox .sb-busy { color: var(--warn); }
  #deep .sandbox button { margin-top: 8px; padding: 6px 10px; }
  #deep .sandbox .sbsub { font-size: 11px; color: var(--faint); margin: 2px 0 4px; }
  #deep .sandbox .sbcalm { font-size: 11px; color: var(--ok); margin: 4px 0; line-height: 1.4; }
  #deep .sandbox .sbsub2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 8px 0 2px; }
  #deep .sandbox .sbwarn { font-size: 11px; color: var(--warn); margin: 4px 0; line-height: 1.45; }
  #reportbox { margin-top: 10px; padding: 10px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
  #reportbox[hidden], [hidden] { display: none !important; }
  textarea { display: block; width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 64px; resize: vertical; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { border-color: var(--accent); }
  .spin { color: var(--muted); }
  .spin::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border: 2px solid var(--line); border-top-color: var(--accent2); border-radius: 50%; vertical-align: -1px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spin::before { animation: none; }
  }
</style>
</head>
<body>
  <header><span class="brand"><img src="icons/icon128.png" alt="" width="22" height="22"><span>Guard3</span></span><span id="badge" class="badge none">–</span></header>
  <main>
    <div class="host" id="host">…</div>
    <ul id="reasons"></ul>
    <button id="allow" hidden data-i18n="popup_allow">I trust this site (add to allowlist)</button>
    <div class="row">
      <button id="deepscan" class="primary" data-i18n="popup_deep_scan">Deep scan</button>
      <button id="reportbtn" data-i18n="popup_report">Report this site</button>
    </div>
    <div id="deep"></div>
    <div id="reportbox" hidden>
      <textarea id="note" data-i18n-placeholder="popup_report_note"></textarea>
      <div class="row"><button id="sendreport" class="primary" data-i18n="popup_report_send">Send report</button><button id="cancelreport" data-i18n="popup_cancel">Cancel</button></div>
    </div>
    <div class="meta" id="meta"></div>
    <button id="options" data-i18n="popup_options">Settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
